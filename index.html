<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vardiya Giriş / Çıkış</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 20px; margin: 0 0 24px; }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 16px;
  }
  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .primary { background: #2563eb; color: white; }
  .primary:disabled { background: #475569; cursor: not-allowed; }
  .link {
    background: none;
    color: #64748b;
    font-size: 13px;
    font-weight: 400;
    padding: 10px 0 0;
    text-decoration: underline;
  }
  .hidden { display: none; }

  /* ---- Bilgilendirme pop-up'ı ---- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  /* ID seçicisi class'tan güçlü olduğu için .hidden tek başına yetmez */
  #overlay.hidden { display: none; }
  #popup {
    background: #1e293b;
    border-radius: 20px;
    padding: 36px 28px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border-top: 8px solid #38bdf8;
  }
  #popup.ok { border-top-color: #4ade80; }
  #popup.err { border-top-color: #f87171; }
  #popupIcon { font-size: 56px; line-height: 1; margin-bottom: 16px; }
  #popupText {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.35;
    margin: 0;
  }
  #popup.ok #popupText { color: #4ade80; }
  #popup.err #popupText { color: #f87171; }
  #popupDetail {
    font-size: 18px;
    color: #cbd5e1;
    margin: 14px 0 0;
    line-height: 1.45;
  }
  #popupClose {
    background: #334155;
    color: #e2e8f0;
    margin-top: 26px;
    font-size: 19px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Vardiya Giriş / Çıkış</h1>

  <div id="registerForm">
    <p style="font-size:14px;color:#94a3b8;">İlk kullanım — ad soyadınızı girin</p>
    <input id="regName" type="text" placeholder="Ad" autocomplete="given-name">
    <input id="regSurname" type="text" placeholder="Soyad" autocomplete="family-name">
    <button class="primary" onclick="handleRegister()">Devam Et</button>
  </div>

  <div id="mainScreen" class="hidden">
    <p id="welcomeText" style="font-size:15px;color:#94a3b8;"></p>
    <button class="primary" id="checkinBtn" onclick="handleCheckIn()">Giriş / Çıkış Yap</button>
    <button class="link" onclick="handleForget()">Ben başkasıyım / bilgilerimi değiştir</button>
  </div>
</div>

<div id="overlay" class="hidden" onclick="hidePopup(event)">
  <div id="popup" onclick="event.stopPropagation()">
    <div id="popupIcon"></div>
    <p id="popupText"></p>
    <p id="popupDetail"></p>
    <button id="popupClose" onclick="hidePopup()">Tamam</button>
  </div>
</div>

<script>
  // ---- AYAR: Apps Script Web App URL'inizi buraya yapıştırın ----
  // Kurulum adımları için README.md dosyasına bakın.
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx2juhUt8kNtMRvmPT8LH70zP5VYSoRRQyoQruLfIz_phx20OJvAB1IVuPhHe34hZs/exec';
  // ---------------------------------------------------------------

  var NAME_KEY = 'vardiya_ad';
  var SURNAME_KEY = 'vardiya_soyad';
  var REQUEST_TIMEOUT_MS = 20000;

  /**
   * Bilgilendirme pop-up'ı.
   * @param {string} type 'ok' | 'err' | 'info' — 'info' beklerken gösterilir, kapatma butonu çıkmaz.
   */
  function showPopup(type, text, detail) {
    var popup = document.getElementById('popup');

    popup.className = type;
    document.getElementById('popupIcon').textContent =
      type === 'ok' ? '✓' : (type === 'err' ? '!' : '⏳');
    document.getElementById('popupText').textContent = text;
    document.getElementById('popupDetail').textContent = detail || '';
    document.getElementById('popupClose').style.display = (type === 'info') ? 'none' : 'block';

    document.getElementById('overlay').classList.remove('hidden');
  }

  function hidePopup(event) {
    if (event && event.target.id !== 'overlay' && event.target.id !== 'popupClose') {
      return;
    }
    document.getElementById('overlay').classList.add('hidden');
  }

  /**
   * Apps Script'e JSONP ile istek atar.
   * Sayfa farklı bir alan adında barındığı için normal fetch CORS'a takılır;
   * JSONP script etiketiyle çalıştığı için sunucuda ek ayar gerektirmez.
   */
  function callApi(params, onSuccess, onError) {
    if (APPS_SCRIPT_URL.indexOf('BURAYA') === 0) {
      onError(new Error('Uygulama adresi ayarlanmamış (APPS_SCRIPT_URL).'));
      return;
    }

    var cbName = 'vardiyaCb' + Date.now() + Math.floor(Math.random() * 10000);
    var script = document.createElement('script');
    var finished = false;
    var timer;

    function cleanup() {
      finished = true;
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) { script.parentNode.removeChild(script); }
    }

    window[cbName] = function (res) {
      if (finished) { return; }
      cleanup();
      if (res && res.ok) {
        onSuccess(res.data);
      } else {
        onError(new Error((res && res.error) || 'Bilinmeyen bir hata oluştu.'));
      }
    };

    script.onerror = function () {
      if (finished) { return; }
      cleanup();
      onError(new Error('Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edin.'));
    };

    timer = setTimeout(function () {
      if (finished) { return; }
      cleanup();
      onError(new Error('Sunucu yanıt vermedi. Lütfen tekrar deneyin.'));
    }, REQUEST_TIMEOUT_MS);

    var query = [];
    for (var key in params) {
      if (Object.prototype.hasOwnProperty.call(params, key)) {
        query.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
      }
    }
    query.push('callback=' + cbName);

    script.src = APPS_SCRIPT_URL + '?' + query.join('&');
    document.body.appendChild(script);
  }

  function init() {
    var name = localStorage.getItem(NAME_KEY);
    var surname = localStorage.getItem(SURNAME_KEY);
    if (name && surname) {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
      document.getElementById('welcomeText').textContent = 'Merhaba, ' + name + ' ' + surname;
    } else {
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('mainScreen').classList.add('hidden');
    }
  }

  function handleRegister() {
    var name = document.getElementById('regName').value.trim();
    var surname = document.getElementById('regSurname').value.trim();

    if (!name || !surname) {
      showPopup('err', 'Ad ve soyad giriniz.');
      return;
    }

    localStorage.setItem(NAME_KEY, name);
    localStorage.setItem(SURNAME_KEY, surname);
    init();
  }

  function handleForget() {
    localStorage.removeItem(NAME_KEY);
    localStorage.removeItem(SURNAME_KEY);
    document.getElementById('regName').value = '';
    document.getElementById('regSurname').value = '';
    init();
  }

  function handleCheckIn() {
    var name = localStorage.getItem(NAME_KEY);
    var surname = localStorage.getItem(SURNAME_KEY);
    if (!name || !surname) {
      showPopup('err', 'Kayıt bulunamadı.', 'Lütfen ad soyadınızı tekrar girin.');
      init();
      return;
    }

    if (!navigator.geolocation) {
      showPopup('err', 'Konum desteklenmiyor.', 'Tarayıcınız konum servisini desteklemiyor.');
      return;
    }

    var btn = document.getElementById('checkinBtn');
    btn.disabled = true;

    // Daha önce izin reddedildiyse tarayıcı otomatik olarak yeniden sormaz;
    // kullanıcıya izni nasıl açacağını göstermemiz gerekir.
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' }).then(
        function (status) {
          if (status.state === 'denied') {
            btn.disabled = false;
            showPopup('err', 'Konum izni engellenmiş.',
              'Adres çubuğundaki kilit simgesinden konum iznini "İzin ver" yapıp tekrar deneyin.');
            return;
          }
          requestLocationAndCheckIn(btn, name, surname);
        },
        function () {
          requestLocationAndCheckIn(btn, name, surname);
        }
      );
    } else {
      requestLocationAndCheckIn(btn, name, surname);
    }
  }

  function requestLocationAndCheckIn(btn, name, surname) {
    showPopup('info', 'Konumunuz alınıyor...');

    navigator.geolocation.getCurrentPosition(
      function (position) {
        showPopup('info', 'Kaydediliyor...');
        callApi(
          {
            action: 'log',
            name: name,
            surname: surname,
            lat: position.coords.latitude,
            lng: position.coords.longitude
          },
          function (result) {
            btn.disabled = false;
            showPopup('ok', result.action + ' kaydınız alındı',
              result.name + ' ' + result.surname + ' — saat ' + result.time);
          },
          function (err) {
            btn.disabled = false;
            showPopup('err', err.message);
          }
        );
      },
      function (error) {
        btn.disabled = false;
        if (error.code === error.PERMISSION_DENIED) {
          showPopup('err', 'Konum izni reddedildi.',
            'Kayıt yapabilmek için konum erişimine izin vermelisiniz.');
        } else if (error.code === error.TIMEOUT) {
          showPopup('err', 'Konum alınamadı.', 'Zaman aşımı oldu, lütfen tekrar deneyin.');
        } else {
          showPopup('err', 'Konum alınamadı.',
            'GPS/konum servisinin açık olduğundan emin olup tekrar deneyin.');
        }
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  init();
</script>
</body>
</html>

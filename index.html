  // ---------------------------------------------------------------

  var NAME_KEY = 'vardiya_ad';
  var SURNAME_KEY = 'vardiya_soyad';
  // Apps Script yavaş bağlantılarda geç yanıt verebiliyor; süre cömert tutuldu
  var REQUEST_TIMEOUT_MS = 45000;
  // Zaman aşımı sonrası doğrulamada, bu süre içindeki bir kayıt "az önce yapıldı" sayılır
  var CONFIRM_WINDOW_MS = 3 * 60 * 1000;
  // Konum örneklemesi: bu hassasiyete ulaşınca beklemeyi bırak, en fazla bu kadar bekle
  var GOOD_ACCURACY_M = 50;
  var LOCATION_MAX_WAIT_MS = 12000;
  // Kayıt isteği için deneme süreleri. İlk deneme uzun tutulur çünkü Apps Script'in
  // soğuk başlangıcı birkaç saniye sürebiliyor; sonraki denemeler daha kısadır.
  var LOG_ATTEMPT_TIMEOUTS_MS = [25000, 15000, 15000];
  // Ön ısıtma (bkz. aşağıdaki "ISITMA" bölümü)
  var WARM_FIX_MAX_AGE_MS = 30000;           // bundan eski ısıtma konumu kullanılmaz
  var WARM_LOCATION_MAX_MS = 5 * 60 * 1000;  // sayfa açık kalırsa takibi bu süre sonunda durdur
  var WARM_REQUEST_TIMEOUT_MS = 10000;       // ısıtma isteği — başarısız olursa sessizce geçilir

  /**
   * Bilgilendirme pop-up'ı.
   * @param {string} type 'ok' | 'err' | 'info' — 'info' beklerken gösterilir, kapatma butonu çıkmaz.
   */
  function showPopup(type, text, detail) {
    var popup = document.getElementById('popup');

    popup.className = type;
    document.getElementById('popupIcon').textContent =
      type === 'ok' ? '✓' : (type === 'err' ? '!' : '⏳');
    document.getElementById('popupText').textContent = text;
    document.getElementById('popupDetail').textContent = detail || '';
    document.getElementById('popupClose').style.display = (type === 'info') ? 'none' : 'block';

    document.getElementById('overlay').classList.remove('hidden');
  }

  function hidePopup(event) {
    if (event && event.target.id !== 'overlay' && event.target.id !== 'popupClose') {
      return;
    }
    document.getElementById('overlay').classList.add('hidden');
  }

  /**
   * Apps Script'e JSONP ile istek atar.
   * Sayfa farklı bir alan adında barındığı için normal fetch CORS'a takılır;
   * JSONP script etiketiyle çalıştığı için sunucuda ek ayar gerektirmez.
   */
  function transportError(message) {
    var err = new Error(message);
    err.transport = true; // ulaşım hatası — tekrar denemeye değer
    return err;
  }

  function callApi(params, onSuccess, onError, timeoutMs) {
    if (APPS_SCRIPT_URL.indexOf('BURAYA') === 0) {
      onError(new Error('Uygulama adresi ayarlanmamış (APPS_SCRIPT_URL).'));
      return;
    }

    var cbName = 'vardiyaCb' + Date.now() + Math.floor(Math.random() * 10000);
    var script = document.createElement('script');
    var finished = false;
    var timer;

    function cleanup() {
      finished = true;
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) { script.parentNode.removeChild(script); }
    }

    window[cbName] = function (res) {
      if (finished) { return; }
      cleanup();
      if (res && res.ok) {
        onSuccess(res.data);
      } else {
        // Sunucudan gelen kural hatası (ör. "Bugün zaten giriş yaptınız.") —
        // tekrar denemek anlamsız, transport işaretlenmez.
        onError(new Error((res && res.error) || 'Bilinmeyen bir hata oluştu.'));
      }
    };

    script.onerror = function () {
      if (finished) { return; }
      cleanup();
      onError(transportError('Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edin.'));
    };

    timer = setTimeout(function () {
      if (finished) { return; }
      cleanup();
      onError(transportError('Sunucu yanıt vermedi. Lütfen tekrar deneyin.'));
    }, timeoutMs || REQUEST_TIMEOUT_MS);

    var query = [];
    for (var key in params) {
      if (Object.prototype.hasOwnProperty.call(params, key)) {
        query.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
      }
    }
    query.push('callback=' + cbName);

    script.src = APPS_SCRIPT_URL + '?' + query.join('&');
    document.body.appendChild(script);
  }

  /* ================== ISITMA ==================
   * Kaydın en yavaş iki adımı, butona basmakla ilgisi olmayan iki bekleyiştir:
   * telefonun GPS'i ilk kez kilitlemesi (saniyeler) ve Apps Script'in soğuk
   * başlangıcı (saniyeler). İkisi de sayfa açılır açılmaz arka planda başlatılır,
   * böylece kullanıcı butona bastığında iş çoktan bitmiş olur.
   */

  var warmPosition = null;   // arka planda toplanan en iyi konum
  var warmWatchId = null;

  function startLocationWarmup() {
    if (warmWatchId !== null || !navigator.geolocation) { return; }

    warmWatchId = navigator.geolocation.watchPosition(
      function (position) {
        // Eşitlikte de güncelle — aynı hassasiyetteki yeni okuma daha tazedir
        if (!warmPosition || position.coords.accuracy <= warmPosition.coords.accuracy) {
          warmPosition = position;
        }
      },
      function () { /* yoksay — butona basınca normal konum akışı devreye girer */ },
      { enableHighAccuracy: true, maximumAge: 0 }
    );

    // Sayfa uzun süre açık unutulursa pili boşuna tüketmesin
    setTimeout(stopLocationWarmup, WARM_LOCATION_MAX_MS);
  }

  function stopLocationWarmup() {
    if (warmWatchId === null) { return; }
    navigator.geolocation.clearWatch(warmWatchId);
    warmWatchId = null;
  }

  /**
   * Isıtmayı yalnızca konum izni DAHA ÖNCE verilmişse başlatır.
   * İzin durumu bilinmiyorsa hiçbir şey yapılmaz: aksi halde sayfa açılır açılmaz
   * izin penceresi çıkar ve kullanıcı ne istendiğini anlamadan reddedebilir.
   * Yani ilk kullanım eskisi gibi, sonraki her okutma hızlı olur.
   */
  function startLocationWarmupIfAllowed() {
    if (!navigator.geolocation || !navigator.permissions || !navigator.permissions.query) {
      return;
    }
    navigator.permissions.query({ name: 'geolocation' }).then(
      function (status) {
        if (status.state === 'granted') { startLocationWarmup(); }
      },
      function () { /* sorgulanamıyorsa ısıtma yapılmaz */ }
    );
  }

  /** Isıtmadan gelen konum hâlâ güvenle kullanılabilir mi? Değilse null. */
  function freshWarmPosition() {
    if (!warmPosition) { return null; }
    if (warmPosition.coords.accuracy > GOOD_ACCURACY_M) { return null; }
    if (Date.now() - warmPosition.timestamp > WARM_FIX_MAX_AGE_MS) { return null; }
    return warmPosition;
  }

  /**
   * Sunucuyu uyandırır ve son işlemi ekranda gösterir.
   * Hafif bir sorgu ('status'), ama Apps Script örneğini ve tablo bağlantısını
   * ayağa kaldırdığı için asıl kayıt isteği hazır bir sunucuya düşer.
   */
  function warmUpServer(name, surname) {
    callApi(
      { action: 'status', name: name, surname: surname },
      function (st) {
        if (st && st.lastAction && st.lastTime) {
          document.getElementById('lastActionText').textContent =
            'Son işlem: ' + st.lastAction + ' — ' + st.lastTime;
        }
      },
      function () { /* yoksay — ısıtma başarısız olsa da kayıt akışı çalışır */ },
      WARM_REQUEST_TIMEOUT_MS
    );
  }
  /* ============== ISITMA SONU ============== */

  function init() {
    var name = localStorage.getItem(NAME_KEY);
    var surname = localStorage.getItem(SURNAME_KEY);
    if (name && surname) {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
      document.getElementById('welcomeText').textContent = 'Merhaba, ' + name + ' ' + surname;
      startLocationWarmupIfAllowed();
      warmUpServer(name, surname);
    } else {
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('mainScreen').classList.add('hidden');
    }
  }

  function handleRegister() {
    var name = document.getElementById('regName').value.trim();
    var surname = document.getElementById('regSurname').value.trim();

    if (!name || !surname) {
      showPopup('err', 'Ad ve soyad giriniz.');
      return;
    }

    localStorage.setItem(NAME_KEY, name);
    localStorage.setItem(SURNAME_KEY, surname);
    init();
  }

  function handleCheckIn() {
    var name = localStorage.getItem(NAME_KEY);
    var surname = localStorage.getItem(SURNAME_KEY);
    if (!name || !surname) {
      showPopup('err', 'Kayıt bulunamadı.', 'Lütfen ad soyadınızı tekrar girin.');
      init();
      return;
    }

    if (!navigator.geolocation) {
      showPopup('err', 'Konum desteklenmiyor.', 'Tarayıcınız konum servisini desteklemiyor.');
      return;
    }

    var btn = document.getElementById('checkinBtn');
    btn.disabled = true;

    // Isıtmadan taze ve hassas bir konum varsa doğrudan kaydet: konum bekleme adımı
    // tamamen atlanır. Böyle bir konumun var olması izninin verildiğinin de kanıtıdır,
    // o yüzden aşağıdaki izin kontrolüne de gerek kalmaz.
    var warm = freshWarmPosition();
    if (warm) {
      submitPosition(btn, name, surname, warm);
      return;
    }

    // Daha önce izin reddedildiyse tarayıcı otomatik olarak yeniden sormaz;
    // kullanıcıya izni nasıl açacağını göstermemiz gerekir.
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' }).then(
        function (status) {
          if (status.state === 'denied') {
            btn.disabled = false;
            showPopup('err', 'Konum izni engellenmiş.',
              'Adres çubuğundaki kilit simgesinden konum iznini "İzin ver" yapıp tekrar deneyin.');
            return;
          }
          requestLocationAndCheckIn(btn, name, surname);
        },
        function () {
          requestLocationAndCheckIn(btn, name, surname);
        }
      );
    } else {
      requestLocationAndCheckIn(btn, name, surname);
    }
  }

  /**
   * Konumu tek okumayla değil, kısa süre örnekleyerek alır ve en hassas olanı seçer.
   * Bazı telefonlar ilk okumayı baz istasyonu/Wi-Fi üzerinden verir (yüzlerce metre
   * sapabilir); GPS birkaç saniye içinde devreye girip çok daha isabetli sonuç üretir.
   */
  function getBestPosition(onSuccess, onError) {
    var best = null;
    var watchId = null;
    var timer = null;
    var done = false;

    function stop() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); }
      clearTimeout(timer);
    }

    function finish() {
      if (done) { return; }
      done = true;
      stop();
      if (best) {
        onSuccess(best);
      } else {
        onError({ code: 3 }); // TIMEOUT
      }
    }

    watchId = navigator.geolocation.watchPosition(
      function (position) {
        if (!best || position.coords.accuracy < best.coords.accuracy) {
          best = position;
        }
        if (best.coords.accuracy <= GOOD_ACCURACY_M) {
          finish();
        }
      },
      function (error) {
        if (done) { return; }
        // Elde bir okuma varsa hatayı yok say, mevcut en iyi konumu kullan
        if (best) { finish(); return; }
        done = true;
        stop();
        onError(error);
      },
      { enableHighAccuracy: true, timeout: LOCATION_MAX_WAIT_MS, maximumAge: 0 }
    );

    timer = setTimeout(finish, LOCATION_MAX_WAIT_MS);
  }

  /** Her kayıt denemesi için benzersiz kimlik — sunucudaki tekrar korumasının anahtarı. */
  function newRequestId() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  /**
   * Kayıt isteğini gönderir; ulaşım hatalarında otomatik tekrar dener.
   * Aynı reqId ile gönderildiği için sunucu tekrarları yeni kayıt olarak işlemez,
   * ilk isteğin sonucunu geri döner — çift kayıt riski yoktur.
   */
  function sendLogWithRetry(params, attempt, onSuccess, onError) {
    callApi(
      params,
      onSuccess,
      function (err) {
        var canRetry = err.transport && attempt + 1 < LOG_ATTEMPT_TIMEOUTS_MS.length;
        if (!canRetry) {
          onError(err);
          return;
        }
        showPopup('info', 'Bağlantı yavaş, tekrar deneniyor...');
        setTimeout(function () {
          sendLogWithRetry(params, attempt + 1, onSuccess, onError);
        }, 1500);
      },
      LOG_ATTEMPT_TIMEOUTS_MS[attempt]
    );
  }

  /** Elde edilmiş bir konumla kayıt isteğini gönderir. */
  function submitPosition(btn, name, surname, position) {
    showPopup('info', 'Kaydediliyor...');
    sendLogWithRetry(
      {
        action: 'log',
        name: name,
        surname: surname,
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        accuracy: position.coords.accuracy,
        reqId: newRequestId()
      },
      0,
      function (result) {
        btn.disabled = false;
        stopLocationWarmup(); // işlem bitti, konum takibini sürdürmenin anlamı yok
        document.getElementById('lastActionText').textContent =
          'Son işlem: ' + result.action + ' — ' + result.time;
        showPopup('ok', result.action + ' kaydınız alındı',
          result.name + ' ' + result.surname + ' — saat ' + result.time);
      },
      function (err) {
        // Kural hatalarını doğrudan göster; yalnızca ulaşım hatalarında
        // kaydın yine de oluşmuş olabileceğini sunucudan doğrula.
        if (!err.transport) {
          btn.disabled = false;
          showPopup('err', err.message);
          return;
        }
        verifyAfterFailure(btn, name, surname, err);
      }
    );
  }

  function requestLocationAndCheckIn(btn, name, surname) {
    showPopup('info', 'Konumunuz alınıyor...');

    getBestPosition(
      function (position) {
        submitPosition(btn, name, surname, position);
      },
      function (error) {
        btn.disabled = false;
        // 1 = PERMISSION_DENIED, 2 = POSITION_UNAVAILABLE, 3 = TIMEOUT
        if (error.code === 1) {
          showPopup('err', 'Konum izni reddedildi.',
            'Kayıt yapabilmek için konum erişimine izin vermelisiniz.');
        } else if (error.code === 3) {
          showPopup('err', 'Konum alınamadı.',
            'Açık alana çıkıp veya pencere kenarına yaklaşıp tekrar deneyin.');
        } else {
          showPopup('err', 'Konum alınamadı.',
            'GPS/konum servisinin açık olduğundan emin olup tekrar deneyin.');
        }
      }
    );
  }

  /**
   * İstek başarısız göründüğünde son durumu sunucudan sorar.
   * Apps Script işlemi tamamlayıp yanıtı geç/hiç ulaştırmayabiliyor; bu durumda
   * kayıt aslında oluşmuş olur ve kullanıcıya hata göstermek yanıltıcı olurdu.
   */
  function verifyAfterFailure(btn, name, surname, originalError, attempt) {
    attempt = attempt || 1;
    showPopup('info', 'Bağlantı yavaş, kontrol ediliyor...');

    callApi(
      { action: 'status', name: name, surname: surname },
      function (st) {
        btn.disabled = false;
        var recent = st && st.lastTimeISO &&
          (Date.now() - new Date(st.lastTimeISO).getTime()) < CONFIRM_WINDOW_MS;

        if (recent) {
          showPopup('ok', st.lastAction + ' kaydınız alındı',
            name + ' ' + surname + ' — saat ' + st.lastTime);
        } else {
          showPopup('err', originalError.message);
        }
      },
      function () {
        // Doğrulama da ulaşamadıysa bir kez daha dene; bağlantı anlık kopmuş olabilir
        if (attempt < 3) {
          setTimeout(function () {
            verifyAfterFailure(btn, name, surname, originalError, attempt + 1);
          }, 2000);
          return;
        }

        btn.disabled = false;
        showPopup('err', originalError.message);
      }
    );
  }

  init();
</script>
